<!DOCTYPE html>
<html>
<head>
    <style>
        :root { --neon: #00ff88; --bg: #0d1117; --danger: #ff4757; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { display: flex; background: #161b22; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 800px; height: 450px; }
        /* Game Screen */
        .game-area { flex: 2; position: relative; border-right: 1px solid #30363d; background: radial-gradient(circle at center, #1c2128 0%, #0d1117 100%); }
        canvas { width: 100%; height: 100%; }
        #mult-display { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 5rem; font-weight: 800; color: var(--neon); text-shadow: 0 0 20px rgba(0,255,136,0.3); }
        /* Sidebar */
        .sidebar { flex: 1; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; }
        .wallet-info { font-size: 0.9rem; color: #8b949e; margin-bottom: 20px; }
        .wallet-info span { color: white; font-size: 1.5rem; font-weight: bold; display: block; }
        input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        #bet-btn { background: var(--neon); color: #0d1117; }
        #bet-btn:hover { background: #00e577; transform: translateY(-2px); }
        #cash-btn { background: #f1c40f; color: black; display: none; }
        .history { margin-top: 20px; color: #8b949e; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div id="mult-display">1.00x</div>
        </div>
        <div class="sidebar">
            <div class="wallet-info">Balance: <span id="balance">$100.00</span></div>
            <div>
                <label>Bet Amount</label>
                <input type="number" id="bet-amt" value="10">
                <button id="bet-btn" onclick="startGame()">PLACE BET</button>
                <button id="cash-btn" onclick="cashOut()">CASH OUT</button>
            </div>
            <div class="history">Last: <span id="last-crash">--</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let balance = 100;
        let multiplier = 1.0;
        let gameActive = false;
        let bet = 0;
        let points = [];

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.onresize = resize;
        resize();

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = gameActive ? "#00ff88" : "#ff4757";
            ctx.lineWidth = 4;
            ctx.beginPath();
            
            // Draw rising line
            points.forEach((p, i) => {
                const x = (i / 500) * canvas.width;
                const y = canvas.height - (Math.pow(p, 1.5) * 40);
                if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Draw Arrow Head
            if (points.length > 0) {
                const lastX = ((points.length-1) / 500) * canvas.width;
                const lastY = canvas.height - (Math.pow(points[points.length-1], 1.5) * 40);
                ctx.fillStyle = ctx.strokeStyle;
                ctx.beginPath();
                ctx.arc(lastX, lastY, 8, 0, Math.PI * 2);
                ctx.fill();
            }
            if (gameActive) requestAnimationFrame(drawGame);
        }

        function startGame() {
            bet = parseFloat(document.getElementById('bet-amt').value);
            if (bet > balance || bet <= 0) return alert("Check balance/bet!");
            
            balance -= bet;
            document.getElementById('balance').innerText = `$${balance.toFixed(2)}`;
            gameActive = true;
            multiplier = 1.0;
            points = [1.0];
            
            const crashAt = Math.random() < 0.05 ? 1.0 : (0.98 / (1 - Math.random())).toFixed(2);
            
            document.getElementById('bet-btn').style.display = "none";
            document.getElementById('cash-btn').style.display = "block";
            document.getElementById('mult-display').style.color = "#00ff88";

            let tick = setInterval(() => {
                multiplier += 0.01;
                points.push(multiplier);
                document.getElementById('mult-display').innerText = multiplier.toFixed(2) + "x";

                if (multiplier >= crashAt) {
                    clearInterval(tick);
                    crash(multiplier);
                }
            }, 50);
            drawGame();
        }

        function cashOut() {
            if (!gameActive) return;
            const win = bet * multiplier;
            balance += win;
            gameActive = false;
            document.getElementById('balance').innerText = `$${balance.toFixed(2)}`;
            resetUI();
        }

        function crash(m) {
            gameActive = false;
            document.getElementById('mult-display').style.color = "#ff4757";
            document.getElementById('last-crash').innerText = m.toFixed(2) + "x";
            resetUI();
        }

        function resetUI() {
            document.getElementById('bet-btn').style.display = "block";
            document.getElementById('cash-btn').style.display = "none";
        }
    </script>
</body>
</html>
