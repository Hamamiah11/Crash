<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --neon: #00ff88; --bg: #0a0c10; --grid: #1c2128; --danger: #ff4757; --font: 'Roboto Mono', monospace; }
        body { background: var(--bg); color: white; font-family: var(--font); font-weight: 700; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { display: flex; background: #161b22; border: 2px solid #30363d; border-radius: 12px; width: 850px; height: 480px; overflow: hidden; }
        .game-area { flex: 2; position: relative; background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 40px 40px; }
        canvas { width: 100%; height: 100%; position: absolute; }
        #mult-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 5.5rem; color: var(--neon); z-index: 10; text-shadow: 0 0 20px rgba(0,255,136,0.2); }
        .sidebar { flex: 0.8; padding: 30px; background: #0d1117; display: flex; flex-direction: column; border-left: 2px solid #30363d; }
        .wallet-info { margin-bottom: 30px; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
        .wallet-info span { color: var(--neon); font-size: 1.4rem; display: block; }
        input { background: #161b22; border: 2px solid #30363d; color: white; padding: 12px; border-radius: 4px; margin: 8px 0 20px 0; width: 100%; box-sizing: border-box; font-family: var(--font); }
        button { width: 100%; padding: 18px; border-radius: 4px; border: none; font-family: var(--font); font-weight: 700; cursor: pointer; font-size: 1.1rem; }
        #bet-btn { background: var(--neon); color: #000; }
        #cash-btn { background: #ffc107; color: #000; display: none; }
        .history { margin-top: auto; font-size: 0.8rem; color: #8b949e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div id="mult-display">1.00x</div>
        </div>
        <div class="sidebar">
            <div class="wallet-info">BALANCE<span id="balance">$100.00</span></div>
            <div>
                <label>Bet Amount</label>
                <input type="number" id="bet-amt" value="10">
                <button id="bet-btn" onclick="startGame()">PLACE BET</button>
                <button id="cash-btn" onclick="cashOut()">CASH OUT</button>
            </div>
            <div class="history">RECENT CRASH: <span id="last-crash" style="color:white">--</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let balance = 100;
        let multiplier = 1.0;
        let gameRunning = false; // Is the line moving?
        let userInGame = false;  // Is the player still betting?
        let bet = 0;
        let points = [];
        let crashAt = 0;

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.onresize = resize;
        resize();

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = gameRunning ? (userInGame ? "#00ff88" : "#8b949e") : "#ff4757";
            ctx.lineWidth = 5;
            ctx.beginPath();
            
            points.forEach((p, i) => {
                const x = (i / 400) * canvas.width;
                const y = canvas.height - (Math.pow(p, 1.3) * 50);
                if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();

            if (points.length > 0) {
                const lastX = ((points.length-1) / 400) * canvas.width;
                const lastY = canvas.height - (Math.pow(points[points.length-1], 1.3) * 50);
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(lastX, lastY, 6, 0, Math.PI * 2); ctx.fill();
            }
            if (gameRunning) requestAnimationFrame(drawGame);
        }

        function startGame() {
            if(gameRunning) return;
            bet = parseFloat(document.getElementById('bet-amt').value);
            if (bet > balance || bet <= 0) return;
            
            balance -= bet;
            document.getElementById('balance').innerText = `$${balance.toFixed(2)}`;
            
            // MATH: 5% chance of instant "Drop" (1.0 - 1.2), otherwise normal growth
            const isDrop = Math.random() < 0.05;
            crashAt = isDrop ? (1.0 + Math.random() * 0.2) : (0.98 / (1 - Math.random()));
            crashAt = Math.max(1.0, parseFloat(crashAt)).toFixed(2);

            gameRunning = true;
            userInGame = true;
            multiplier = 1.0;
            points = [1.0];
            
            document.getElementById('bet-btn').style.display = "none";
            document.getElementById('cash-btn').style.display = "block";
            document.getElementById('mult-display').style.color = "var(--neon)";

            let tick = setInterval(() => {
                multiplier += 0.01;
                points.push(multiplier);
                document.getElementById('mult-display').innerText = multiplier.toFixed(2) + "x";

                if (multiplier >= crashAt) {
                    clearInterval(tick);
                    finishRound();
                }
            }, 60);
            drawGame();
        }

        function cashOut() {
            if (!userInGame) return;
            balance += (bet * multiplier);
            document.getElementById('balance').innerText = `$${balance.toFixed(2)}`;
            userInGame = false; // Player is out, but gameRunning stays true
            document.getElementById('cash-btn').style.display = "none";
            document.getElementById('mult-display').style.color = "#8b949e"; // Turn gray to show you cashed out
        }

        function finishRound() {
            gameRunning = false;
            userInGame = false;
            document.getElementById('mult-display').style.color = "var(--danger)";
            document.getElementById('last-crash').innerText = multiplier.toFixed(2) + "x";
            document.getElementById('bet-btn').style.display = "block";
            document.getElementById('cash-btn').style.display = "none";
        }
    </script>
</body>
</html>
