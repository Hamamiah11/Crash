<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Crash</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div id="mult-display">1.00x</div>
        </div>
        <div class="sidebar">
            <div class="wallet-info">BALANCE<span id="balance">$100.00</span></div>
            <div>
                <label>BET AMOUNT</label>
                <input type="number" id="bet-amt" value="10">
                <button id="bet-btn" onclick="startGame()">PLACE BET</button>
                <button id="cash-btn" onclick="cashOut()">CASH OUT</button>
            </div>
            <div class="history">LAST CRASH: <span id="last-crash">--</span></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
